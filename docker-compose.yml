services:
  cp2:
    build: .
    image: hseml-product-return-cp3:latest
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./report:/app/report
    command: python src/train_cp2.py

  api:
    build: .
    image: hseml-product-return-cp3:latest
    ports:
      - "8000:8000"
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    image: hseml-product-return-cp3:latest
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    volumes:
      - ./src:/app/src
    ports:
      - "8501:8501"
    command: streamlit run src/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

  checks:
    build: .
    image: hseml-product-return-cp3:latest
    volumes:
      - .:/app
    command: sh -c "python -m pytest -q && python -m ruff check src tests"
